# CI de la plantilla: corre en cada push y PR.
#
#   1. Busca secretos en los archivos y en todo el historial de git.
#   2. Revisa que los enlaces internos de la documentación no estén rotos.
#   3. Corre las pruebas de los scripts (scripts/*.test.mjs).
#   4. Instala el monorepo con pnpm, audita dependencias y corre
#      `pnpm run check`: formato, lint (incluye la regla de motor
#      determinista), tipos, pruebas y build.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Sin secretos en el repo ni en el historial
        run: node scripts/check-secrets.mjs --history
      - name: Enlaces internos de la documentación
        run: node scripts/check-links.mjs
      - name: Pruebas de los scripts
        run: node --test "scripts/*.test.mjs"
      - name: Instalar dependencias del monorepo
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high
      - name: Formato, lint, tipos, pruebas y build
        run: pnpm run check
