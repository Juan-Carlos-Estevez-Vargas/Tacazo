<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Tacazo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0B1512" />
    <!-- Servidor de partidas; vacío = mismo host, puerto 2567. -->
    <meta name="tacazo-servidor" content="" />
    <meta name="tacazo-api" content="" />
    <meta name="tacazo-turnstile" content="" />
    <style>
      :root {
        --pano: #0e5a45;
        --tiza: #2c6bd8;
        --tiza-claro: #6c9cf0;
        --laton: #c08a2b;
        --laton-claro: #e0a845;
        --marfil: #f7f5ee;
        --noche: #0b1512;
        --tenue: #9fb3ab;
        --borde: #1f332c;
        --titulos: "Anybody", "Arial Black", system-ui, sans-serif;
        --textos: "Atkinson Hyperlegible", system-ui, sans-serif;
        --numeros: "JetBrains Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--noche);
        color: var(--marfil);
        font-family: var(--textos);
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        gap: 6px;
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
      }
      .marca {
        font-family: var(--titulos);
        font-weight: 800;
        letter-spacing: 0.02em;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .marca img {
        width: 24px;
        height: 24px;
      }
      .jugador {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px 10px;
        border-radius: 10px;
        border: 1px solid var(--borde);
        min-width: 0;
      }
      .jugador.activo {
        border-color: var(--tiza);
        box-shadow: 0 0 0 1px var(--tiza) inset;
      }
      #j1 {
        text-align: right;
        align-items: flex-end;
      }
      .nombre {
        font-family: var(--titulos);
        font-weight: 700;
        font-size: 15px;
      }
      .grupo {
        font-size: 12px;
        color: var(--tenue);
      }
      .bolas {
        display: flex;
        gap: 3px;
        min-height: 12px;
      }
      .ficha {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--c);
      }
      .ficha.raya {
        background: linear-gradient(var(--marfil) 25%, var(--c) 25% 75%, var(--marfil) 75%);
      }
      .ficha.fuera {
        opacity: 0.18;
      }
      .linea-aviso {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        min-height: 24px;
        flex-wrap: wrap;
      }
      #aviso {
        text-align: center;
        font-size: 14px;
        color: var(--marfil);
      }
      #reloj {
        font-family: var(--numeros);
        font-size: 13px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--tiza);
      }
      #reloj.poco {
        border-color: #e05252;
        color: #ff8a8a;
      }
      #ver-repeticion {
        min-height: 28px;
        padding: 2px 10px;
      }
      #enlace,
      #buscando,
      #version {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        font-size: 13px;
      }
      #enlace[hidden],
      #buscando[hidden],
      #version[hidden] {
        display: none;
      }
      #enlace input {
        flex: 1 1 220px;
        max-width: 420px;
        font: inherit;
        font-family: var(--numeros);
        font-size: 12px;
        color: var(--marfil);
        background: #0f1f1a;
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 8px;
      }
      .jugador.caido .nombre::after {
        content: " · desconectado";
        font-weight: 400;
        color: #ff8a8a;
        font-size: 12px;
      }
      dialog {
        background: #0f1f1a;
        color: var(--marfil);
        border: 1px solid var(--borde);
        border-radius: 14px;
        padding: 20px;
        width: min(360px, calc(100vw - 32px));
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.6);
      }
      dialog h2 {
        font-family: var(--titulos);
        margin: 0 0 12px;
        font-size: 20px;
      }
      dialog form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      dialog input {
        font: inherit;
        color: var(--marfil);
        background: var(--noche);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 10px;
      }
      .acciones {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      button.principal {
        background: var(--tiza);
        border-color: var(--tiza);
      }
      #mesa {
        flex: 1;
        min-height: 0;
        position: relative;
        touch-action: none;
      }
      #mesa canvas {
        position: absolute;
        inset: 0;
      }
      footer {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #efecto {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff, var(--marfil) 55%, #d8d4c6);
        touch-action: none;
        cursor: crosshair;
        flex: none;
      }
      #efecto-punto {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: var(--tiza);
        pointer-events: none;
      }
      #potencia {
        position: relative;
        flex: 1 1 220px;
        max-width: 520px;
        height: 44px;
        border-radius: 22px;
        border: 1px solid var(--borde);
        background: #0f1f1a;
        touch-action: none;
        cursor: ew-resize;
        overflow: hidden;
      }
      #potencia-relleno {
        --p: 0;
        position: absolute;
        inset: 0;
        transform-origin: left;
        transform: scaleX(var(--p));
        background: linear-gradient(90deg, var(--tiza), var(--laton-claro));
      }
      #potencia span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 13px;
        color: var(--tenue);
        pointer-events: none;
      }
      label,
      select,
      button {
        font: inherit;
        font-size: 13px;
        color: var(--marfil);
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--tenue);
      }
      input[type="range"] {
        width: 90px;
        accent-color: var(--tiza);
      }
      select,
      button {
        background: #0f1f1a;
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 8px 10px;
        min-height: 40px;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible,
      #potencia:focus-visible {
        outline: 2px solid var(--tiza-claro);
        outline-offset: 2px;
      }
      @media (max-height: 480px) {
        .grupo {
          display: none;
        }
        footer {
          gap: 8px;
        }
        #potencia {
          height: 36px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="jugador" id="j0">
          <span class="nombre" id="j0-nombre">Tú</span>
          <span class="grupo" id="j0-grupo">Mesa abierta</span>
          <span class="bolas" id="j0-bolas"></span>
        </div>
        <div class="marca"><img src="/marca/tacazo-icono.svg" alt="" />Tacazo</div>
        <div class="jugador" id="j1">
          <span class="nombre" id="j1-nombre">Bot</span>
          <span class="grupo" id="j1-grupo">Mesa abierta</span>
          <span class="bolas" id="j1-bolas"></span>
        </div>
      </header>
      <div class="linea-aviso">
        <span id="aviso" role="status" aria-live="polite"></span>
        <span id="reloj" hidden aria-label="Tiempo del turno"></span>
        <button id="ver-repeticion" type="button" hidden>Ver repetición</button>
      </div>
      <div id="enlace" hidden>
        <span>Mándale este enlace a tu amigo:</span>
        <input id="enlace-url" readonly aria-label="Enlace de la partida" />
        <button id="copiar-enlace" type="button">Copiar enlace</button>
      </div>
      <div id="buscando" hidden>
        <span id="buscando-texto" role="status" aria-live="polite">Buscando rival…</span>
        <button id="cancelar-busqueda" type="button">Cancelar</button>
        <div id="turnstile" hidden></div>
      </div>
      <div id="version" hidden role="alert">
        Hay una versión nueva de Tacazo. <button type="button" onclick="location.reload()">Actualizar</button>
      </div>
      <div id="mesa"></div>
      <footer>
        <div id="efecto" title="Efecto: toca dónde le pega el taco. Doble toque para el centro.">
          <span id="efecto-punto"></span>
        </div>
        <div
          id="potencia"
          role="slider"
          aria-label="Potencia: arrastra y suelta para tirar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          tabindex="0"
        >
          <div id="potencia-relleno"></div>
          <span>Arrastra y suelta para tirar</span>
        </div>
        <label>Inclinación <input id="inclinacion" type="range" min="0" max="70" value="0" /></label>
        <select id="nivel" aria-label="Nivel del bot">
          <option value="facil">Bot fácil</option>
          <option value="medio" selected>Bot medio</option>
          <option value="dificil">Bot difícil</option>
        </select>
        <button id="nueva" type="button">Contra el bot</button>
        <button id="amigo" type="button">Jugar con un amigo</button>
        <button id="clasificatoria" type="button">Clasificatoria</button>
        <button id="sonido" type="button" aria-pressed="false">Sonido: sí</button>
      </footer>
    </div>
    <dialog id="dialogo-nombre">
      <form method="dialog">
        <h2 id="dialogo-titulo">Jugar con un amigo</h2>
        <label for="nombre">Tu nombre</label>
        <input id="nombre" maxlength="20" autocomplete="nickname" placeholder="Invitado" />
        <div class="acciones">
          <button value="cancelar" formnovalidate>Cancelar</button>
          <button value="ok" class="principal">Entrar</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
